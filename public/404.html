    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admissão Digital - Redirecionando...</title>
    <script>
      // Single Page Apps fallback: redireciona para a raiz preservando a rota atual

      window.location.replace('/');
    </script>

    <p>Redirecionando para o aplicativo...</p>
  </body>
